name: croppilot
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-croppilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-croppilot}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    logging: *logging
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-croppilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-croppilot}
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      ENGINE_MODE: ${ENGINE_MODE:-computed}
      HISTORY_YEARS: ${HISTORY_YEARS:-20}
      ENABLE_ENGINE_DOCS: ${ENABLE_ENGINE_DOCS:-false}
      ENABLE_NASA_POWER: ${ENABLE_NASA_POWER:-true}
      CROPPILOT_CACHE_DIR: ${CROPPILOT_CACHE_DIR:-/tmp/croppilot-cache}
      SOILGRIDS_TIMEOUT_S: ${SOILGRIDS_TIMEOUT_S:-8}
      DATA_DEADLINE_S: ${DATA_DEADLINE_S:-60}
      CACHE_BACKEND_URL: http://web:3000
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-croppilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-croppilot}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      ENGINE_URL: http://engine:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      ENGINE_TIMEOUT_MS: ${ENGINE_TIMEOUT_MS:-90000}
      # Optional AI summary (server-side only). Empty key: the page says it is not set up.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-6-luna}
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-true}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      engine: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *logging
  gateway:
    image: nginx:1.28-alpine
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
  cache-maintenance:
    image: python:3.12-alpine
    command: ["python", "/maintenance.py"]
    volumes: ["./infra/cache-maintenance.py:/maintenance.py:ro"]
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      CACHE_BACKEND_URL: http://web:3000
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
volumes:
  postgres_data:
