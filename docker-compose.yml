# Runs the backend + engine together (local check of the full flow, or a single EC2 host).
#   docker compose up --build
# Frontend: run `npm run dev` in frontend/ (Vite proxies /api to localhost:3000).
services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports: ["8000:8000"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENGINE_URL: http://engine:8000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    ports: ["3000:3000"]
    depends_on: [engine]
