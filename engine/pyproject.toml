[project]
name = "fieldshift-engine"
version = "0.1.0"
description = "Field Shift engine: data service, rotation evaluator and recommender"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Satellite data (P2, later): earthengine-api, earthaccess, rasterio, geopandas

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fieldshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
