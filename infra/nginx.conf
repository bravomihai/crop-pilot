worker_processes auto;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=calculations:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=locations:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=status:10m rate=30r/m;
  # Each AI summary is a paid model call.
  limit_req_zone $binary_remote_addr zone=summaries:10m rate=6r/m;
  limit_req_status 429;
  # In production only Caddy can reach this gateway; it overwrites X-Real-IP.
  # Do not publish the gateway directly or place another proxy in front without reviewing trust.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;
  server {
    listen 80;
    client_max_body_size 32k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 110s;
    proxy_send_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;
    location @rate_limited {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header Retry-After 60 always;
      add_header X-Request-ID $request_id always;
      return 429 '{"code":"rate_limited","error":"Too many requests. Try again later.","request_id":"$request_id"}';
    }
    location @too_large {
      default_type application/json;
      add_header Cache-Control no-store always;
      add_header X-Request-ID $request_id always;
      return 413 '{"code":"request_too_large","error":"The request body is too large.","request_id":"$request_id"}';
    }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }
    location = /api/recommendations {
      limit_req zone=calculations burst=3 nodelay;
      proxy_pass http://web:3000;
    }
    location = /api/locations {
      limit_req zone=locations burst=10 nodelay;
      proxy_pass http://web:3000;
    }
    location = /api/summary {
      # The page sends a trimmed result (about 20–30 KB), larger than the 32k default.
      client_max_body_size 256k;
      limit_req zone=summaries burst=2 nodelay;
      proxy_pass http://web:3000;
    }
    location = /api/engine/status {
      limit_req zone=status burst=5 nodelay;
      proxy_pass http://web:3000;
    }
    location / { proxy_pass http://web:3000; }
  }
}
