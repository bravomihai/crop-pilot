# Host NGINX configuration for crop-pilot.nemes.engineer.
# Install as /etc/nginx/sites-available/crop-pilot.nemes.engineer.
# Certbot adds HTTPS after the DNS A record resolves to this VPS.
server {
    listen 80;
    listen [::]:80;
    server_name crop-pilot.nemes.engineer;

    client_max_body_size 256k;
    client_body_timeout 10s;
    server_tokens off;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace client-supplied forwarding headers before the container gateway.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 115s;
        proxy_send_timeout 10s;
    }
}
