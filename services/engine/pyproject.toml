[project]
name = "croppilot-engine"
version = "0.1.0"
description = "Stateless three-crop planning engine for CropPilot"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.28,<0.29", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["fieldshift*"]
[tool.setuptools.package-data]
"fieldshift.evaluator.rules" = ["*.json"]
fieldshift = ["crop_rules.json", "romania_boundary.geojson"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
